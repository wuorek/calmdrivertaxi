services:

  # ─── Frontend (Nginx + static HTML) ───────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: calmdriver-web:latest
    container_name: calmdriver-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
    networks:
      - calmdriver

  # ─── Backend API (Node.js + nodemailer) ────────────────────────────────
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: calmdriver-api:latest
    container_name: calmdriver-api
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Set these in .env or as GitHub Secrets → deploy env
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - MAIL_TO=${MAIL_TO:-calmdrivertaxi@gmail.com}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://calmdriver.pl}
    networks:
      - calmdriver

networks:
  calmdriver:
    driver: bridge
